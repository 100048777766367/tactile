name: Vòng Đời Làn Da Sinh Tồn (Tactile HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '10 */6 * * *'

permissions:
  contents: write

jobs:
  run-tactile:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Làn Da
        uses: actions/checkout@v7

      - name: Cài đặt Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # 1. DÒ TÌM ĐẠO HÀM TỪ BỘ NÃO
      - name: Xúc tu vươn vòi tìm Não phả hệ
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python receptors/cascade_receptor.py

      - name: Anten bắt sóng Bộ Não toàn cầu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python receptors/mesh_receptor.py

      # 2. MÀNG MIỄN DỊCH KIỂM ĐỊNH ĐẠO HÀM
      - name: Màng miễn dịch kiểm định đạo hàm
        run: python receptors/contract_receptor.py

      # 3. VẬN HÀNH LÀN DA CẢM NHẬN
      - name: Vận hành Động cơ Xúc giác
        run: python tactile_engine.py

      # 4. LƯU VẾT TÍCH VÀO GIT (FAST-FORWARD CHỐNG CONFLICT)
      - name: Phát xung xúc giác & cơn đau lên môi trường mạng
        run: |
          git config --global user.name "Tactile-Skin-Bot"
          git config --global user.email "bot@tactile.node"
          
          git fetch origin main
          git reset origin/main
          git add synapses/ synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🩸 [Xúc Giác & Cơn Đau] Da vừa cảm nhận va chạm nhiệt độ [skip ci]"
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi
